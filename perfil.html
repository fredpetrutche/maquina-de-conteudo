<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Perfil — Máquina de Conteúdo</title>
<link rel="stylesheet" href="app.css?v=202608131326">
<link rel="stylesheet" href="revisao.css?v=202608131326">
</head>
<body>

<div class="app">

  <!-- Abaixo de 60rem o app.css joga a lateral para fora da tela e ela só volta
       com a classe .aberto. Sem maçaneta, a gaveta some e não tem como abrir.
       Aqui é só o ícone, no canto superior esquerdo — a página de leitura não
       precisa perder uma faixa inteira de altura para uma barra de título. -->
  <button class="pf-menu" data-act="menu" aria-label="Abrir o fluxo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <div class="veu" id="veu"></div>

  <aside class="lateral" id="lateral">
    <div class="lat-topo">
      <div class="marca">
        <span class="marca-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/></svg>
        </span>
        <span class="marca-nm">Máquina de Conteúdo</span>
      </div>
      <div class="progresso">
        <span class="prog-t"><i id="progBarra"></i></span>
        <span class="prog-v" id="progVal">— de 3</span>
      </div>
    </div>
    <nav class="lat-nav" id="nav"></nav>
    <div class="lat-pe">
      <div class="quem" id="quem" style="display:none">
        <span class="quem-av" id="quemAv"></span>
        <span class="quem-t"><b id="quemNm"></b><span id="quemEm"></span></span>
      </div>
      <a class="bt simples cheio mini" href="./" style="text-decoration:none;text-align:center">Ir para o app</a>
    </div>
  </aside>

  <main class="palco">
    <div class="larg corpo" id="tela">
      <p class="pf-carga">Abrindo a ficha…</p>
    </div>
  </main>
</div>


<script src="revisao.js?v=202608131326"></script>
<script>
/* Esta página é só a casca. Quem monta a revisão é o revisao.js, o mesmo que o
   app usa como tela de entrada — para as duas mudarem juntas. */
(function () {
  'use strict';
  Revisao.carregar(document.getElementById('tela'),
                   (location.hash || '').replace('#', '').trim());
  window.addEventListener('hashchange', function () { location.reload(); });
})();
</script>
</body>
</html>
