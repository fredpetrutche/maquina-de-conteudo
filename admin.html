<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>Painel — Máquina de Conteúdo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%235856D6'/><path d='M22 30h56M22 50h56M22 70h34' stroke='white' stroke-width='9' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="app.css?v=202608112052">
</head>
<body>

<!-- ============ ENTRADA ============ -->
<div id="entrada" class="adm-entrada">
  <div style="text-align:center;margin-bottom:1.5rem">
    <h1 class="t-1">Painel</h1>
    <p class="sub" style="color:var(--rotulo-2);margin-top:.3rem">Acompanhe quem está preenchendo e onde cada pessoa parou.</p>
  </div>
  <div class="erro" id="entradaErr"></div>
  <div class="grupo">
    <div class="ilha">
      <div class="linha">
        <span class="rot">E-mail</span>
        <input type="text" id="lEmail" autocomplete="username" inputmode="email" placeholder="voce@email.com">
      </div>
      <div class="linha">
        <span class="rot">Senha</span>
        <input type="password" id="lSenha" autocomplete="current-password" placeholder="••••••••">
      </div>
    </div>
  </div>
  <button class="bt forte cheio" id="btEntrar">Entrar</button>
</div>

<!-- ============ PAINEL ============ -->
<div id="painel" class="adm" style="display:none">

  <div class="adm-topo">
    <div>
      <span class="eyebrow" style="font-size:13px;font-weight:600;color:var(--tinta);display:block">Painel</span>
      <h1 class="t-grande">Quem está preenchendo</h1>
    </div>
    <div class="acoes">
      <button class="bt mini" id="btAtualizar">Atualizar</button>
      <button class="bt mini" id="btCsv">Baixar CSV</button>
      <button class="bt mini simples perigo" id="btSair">Sair</button>
    </div>
  </div>

  <div class="indic" style="margin-bottom:1.5rem">
    <div class="ind"><span class="v" id="kTotal">0</span><span class="l">pessoas na base</span></div>
    <div class="ind"><span class="v" id="kFase0">0</span><span class="l">concluíram a Fase 0</span></div>
    <div class="ind"><span class="v" id="kFase1">0</span><span class="l">concluíram a Fase 1</span></div>
    <div class="ind"><span class="v" id="kHoje">0</span><span class="l">ativas nas últimas 24h</span></div>
  </div>

  <div class="ilha" style="overflow:hidden">
    <div class="rolagem" style="background:none;border-radius:0">
      <table class="adm-tbl">
        <thead>
          <tr>
            <th>Pessoa</th><th>Progresso</th><th>Onde está</th>
            <th>Comunidade</th><th>Nicho</th><th>Atividade</th>
          </tr>
        </thead>
        <tbody id="linhas"></tbody>
      </table>
    </div>
    <div class="vazio-msg" id="vazio" style="display:none">Ninguém preencheu ainda.</div>
  </div>
</div>

<!-- ============ DETALHE ============ -->
<div class="det" id="det">
  <div class="det-cx">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.2rem">
      <div style="min-width:0">
        <h3 id="dNome"></h3>
        <span class="em" id="dEmail"></span>
      </div>
      <button class="bt mini" id="btFechar" style="flex:none">Fechar</button>
    </div>
    <div id="dCorpo"></div>
  </div>
</div>

<div class="aviso-f" id="aviso"></div>
<script src="admin.js?v=202608112052"></script>
</body>
</html>
